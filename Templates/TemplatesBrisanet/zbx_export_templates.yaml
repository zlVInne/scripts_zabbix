              expression: 'last(/Template_Linux_MAS_VSI/system.name[node_exporter],#1)<>last(/Template_Linux_MAS_VSI/system.name[node_exporter],#2) and length(last(/Template_Linux_MAS_VSI/system.name[node_exporter]))>0'
              name: 'Linux: System name has changed'
              event_name: 'Linux: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'The name of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: notice
                - tag: scope
                  value: security
        - uuid: dc5ee725337143b5a6168a58c885a6ab
