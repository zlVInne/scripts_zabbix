            key: 'system.run[python3 /etc/zabbix/scripts/convertICHASI.py /etc/zabbix/scripts/ICHASI_{$TAS_IP}.RCC,]'
          lld_macro_paths:
            - lld_macro: '{#CCIP}'
              path: $..ccip.first()
            - lld_macro: '{#TPSIP}'
              path: $..tpsip.first()
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var discovery = [];
                  
                  data.forEach(function(ccipBlock) {
