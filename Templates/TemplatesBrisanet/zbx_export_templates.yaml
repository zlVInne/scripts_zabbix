    - uuid: 0c9861b0fea84a42911181bab95e6079
      template: Template_Linux_MAS_TAS
      name: Template_Linux_MAS_TAS
      templates:
        - name: Template_Linux_Ping_MAS
      groups:
        - name: TAS
        - name: 'Templates/Operating systems'
      items:
        - uuid: 7a8309efa2fa4a9c9b43e5db9c5a2ba2
          name: 'Linux: Number of open file descriptors'
          type: DEPENDENT
          key: 'fd.open[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Miscellaneous Sensors''][''Number of Open File Descriptors'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
          tags:
            - tag: component
              value: system
        - uuid: e49ecd12c97e46aca6879258e5fdca97
          name: 'Linux: Maximum number of open file descriptors'
          type: DEPENDENT
          key: 'kernel.maxfiles[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          description: 'It could be increased by using `sysctl` utility or modifying the file `/etc/sysctl.conf`.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Miscellaneous Sensors''][''Maximum Number of Open File Descriptors'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 46cbe5371266468e8490774b9cb9a89b
              expression: 'last(/Template_Linux_MAS_TAS/kernel.maxfiles[node_exporter])<{$KERNEL.MAXFILES.MIN}'
              name: 'Linux: Configured max number of open filedescriptors is too low'
              event_name: 'Linux: Configured max number of open filedescriptors is too low (< {$KERNEL.MAXFILES.MIN})'
              priority: INFO
              dependencies:
                - name: 'Linux: Running out of file descriptors'
                  expression: 'last(/Template_Linux_MAS_TAS/fd.open[node_exporter])/last(/Template_Linux_MAS_TAS/kernel.maxfiles[node_exporter])*100>80'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: performance
        - uuid: 288daeb2a0a84f1f80f3554814c28cf2
          name: 'Linux: System boot time'
          type: DEPENDENT
          key: 'system.boottime[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: unixtime
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''System Info''][''System Boot Time (Unix Timestamp)'']'
          master_item:
