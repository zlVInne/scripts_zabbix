        - uuid: 86dd0188d0824ed3903da63bcb6f09ec
          name: 'Linux: Free swap space'
          type: DEPENDENT
          key: 'system.swap.free[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
