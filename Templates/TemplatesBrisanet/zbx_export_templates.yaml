        - uuid: 7fedd45aed814c7cad8f75200a270de1
          name: 'Mounted filesystem discovery'
          type: DEPENDENT
          key: 'vfs.fs.discovery[node_exporter]'
          delay: '0'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery of file systems of different types.'
          item_prototypes:
            - uuid: e78bd1f5b6554cb08f4f40e069bc7fb0
              name: '{#DISK}: Free space'
              type: DEPENDENT
              key: 'vfs.fs.free[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Available.first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
              tags:
                - tag: filesystem
                  value: '{#DISK}'
            - uuid: 7005a59229554e078e1b134d4b906bbe
              name: '{#DISK}: Space utilization'
              type: DEPENDENT
              key: 'vfs.fs.pused[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: '%'
              description: 'The space utilization expressed in % for {#FSNAME}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Usage.first()'
                - type: TRIM
                  parameters:
                    - '%'
              master_item:
                key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
              tags:
                - tag: filesystem
                  value: '{#DISK}'
            - uuid: e71809ca95c94959963d9eaf759e1d49
              name: '{#DISK}: Total space'
              type: DEPENDENT
              key: 'vfs.fs.total[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              description: 'Total space in bytes'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Size.first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
              tags:
                - tag: filesystem
                  value: '{#DISK}'
            - uuid: c66b3675afef4544ae3d8bf438603a58
              name: '{#DISK}: Used space'
              type: DEPENDENT
              key: 'vfs.fs.used[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              description: 'Used storage in bytes'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Used.first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
              tags:
                - tag: filesystem
                  value: '{#DISK}'
          trigger_prototypes:
            - uuid: bef5e1daba614b94a2b6c2b8d1f5a75f
              expression: |
                last(/Template_Linux_MAS_VSI/vfs.fs.pused[node_exporter,"{#DISK}"])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"} and
                ((last(/Template_Linux_MAS_VSI/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_MAS_VSI/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"} or timeleft(/Template_Linux_MAS_VSI/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
              name: '{#FSNAME}: Disk space is critically low'
              event_name: '{#FSNAME}: Disk space is critically low (used > {$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}%)'
              opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
              priority: AVERAGE
              description: |
                Two conditions should match:
                1. The first condition - utilization of the space should be above `{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}`.
                2. The second condition should be one of the following:
                - the disk free space is less than `{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"}`;
                - the disk will be full in less than 24 hours.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: capacity
            - uuid: 8759f5afae4e4e63a2781a4f3e00b786
              expression: |
                last(/Template_Linux_MAS_VSI/vfs.fs.pused[node_exporter,"{#DISK}"])>{$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"} and
                ((last(/Template_Linux_MAS_VSI/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_MAS_VSI/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.WARN:"{#FSNAME}"} or timeleft(/Template_Linux_MAS_VSI/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
              name: '{#FSNAME}: Disk space is low'
              event_name: '{#FSNAME}: Disk space is low (used > {$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"}%)'
              opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
              priority: WARNING
              description: |
                Two conditions should match:
                1. The first condition - utilization of the space should be above `{$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"}`.
                2. The second condition should be one of the following:
                - the disk free space is less than `{$VFS.FS.FREE.MIN.WARN:"{#FSNAME}"}`;
                - the disk will be full in less than 24 hours.
              manual_close: 'YES'
              dependencies:
                - name: '{#FSNAME}: Disk space is critically low'
                  expression: |
                    last(/Template_Linux_MAS_VSI/vfs.fs.pused[node_exporter,"{#DISK}"])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"} and
                    ((last(/Template_Linux_MAS_VSI/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_MAS_VSI/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"} or timeleft(/Template_Linux_MAS_VSI/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: capacity
