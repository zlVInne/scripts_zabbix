        - uuid: e32823b3e07b42f0a3095288aff99d1d
          name: 'Linux: Available memory'
          type: DEPENDENT
          key: 'vm.memory.available[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: |
            The available memory:
            - in Linux - available = free + buffers + cache;
            - on other platforms calculation may vary.
            
            See also Appendixes in Zabbix Documentation about parameters of the `vm.memory.size` item.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Memory Metrics''][''Available Memory (Bytes)'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: memory
        - uuid: bd3351744ec2456f82f25700c7630fe4
          name: 'Linux: Total memory'
          type: DEPENDENT
          key: 'vm.memory.total[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: 'The total memory expressed in bytes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Memory Metrics''][''Total Memory (Bytes)'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: memory
        - uuid: 57fe97c68df54d5db4b15f6fe46bf490
          name: 'Linux: Memory utilization'
          type: CALCULATED
          key: 'vm.memory.util[node_exporter]'
          history: 7d
          value_type: FLOAT
          units: '%'
          params: '(last(//vm.memory.total[node_exporter])-last(//vm.memory.available[node_exporter]))/last(//vm.memory.total[node_exporter])*100'
          description: 'Memory used percentage is calculated as (total-available)/total*100.'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: e9727b627e694e1586de9d353444e55e
              expression: 'min(/Template_Linux_VPP/vm.memory.util[node_exporter],5m)>{$MEMORY.UTIL.MAX}'
              name: 'Linux: High memory utilization'
              event_name: 'Linux: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
              priority: AVERAGE
              description: 'The system is running out of free memory.'
              dependencies:
                - name: 'Linux: Lack of available memory'
                  expression: 'max(/Template_Linux_VPP/vm.memory.available[node_exporter],5m)<{$MEMORY.AVAILABLE.MIN} and last(/Template_Linux_VPP/vm.memory.total[node_exporter])>0'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: capacity
                - tag: scope
                  value: performance
      discovery_rules:
        - uuid: 9d06884cadf249749c08366534f3c05b
          name: 'Network interface discovery'
          type: DEPENDENT
          key: 'net.if.discovery[node_exporter]'
          delay: '0'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery of network interfaces. Requires node_exporter v0.18 and up.'
          item_prototypes:
            - uuid: 95382c4cc3ab4ecd95956c803e46dca8
              name: 'Interface {#IFNAME}: Erros'
              type: DEPENDENT
              key: 'net.errors[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''Errors/s''].first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: a2551cb227fb4329b01a1931bc67215a
              name: 'Interface {#IFNAME}: Inbound packets'
              type: DEPENDENT
              key: 'net.if.in.errors[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''InTraffic pkps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: f3805b176d2641ad87169459a39f4c43
              name: 'Interface {#IFNAME}: Bits received'
              type: DEPENDENT
              key: 'net.if.in[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''InTraffic bps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: a0e6c8fe8912435b9fc444fea85c74b7
              name: 'Interface {#IFNAME}: Outbound packets'
              type: DEPENDENT
              key: 'net.if.out.errors[node_exporter"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@[''Interface''] == ''{#IFNAME}'')][''OutTraffic pkps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: bf5b726ff27848258609ce8c3af58e50
              name: 'Interface {#IFNAME}: Bits sent'
              type: DEPENDENT
              key: 'net.if.out[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''OutTraffic bps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
          trigger_prototypes:
            - uuid: 6221a34a3c2748feb82f7e8750a5ea45
              expression: |
                min(/Template_Linux_VPP/net.if.in.errors[node_exporter,"{#IFNAME}"],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
                or min(/Template_Linux_VPP/net.if.out.errors[node_exporter"{#IFNAME}"],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                max(/Template_Linux_VPP/net.if.in.errors[node_exporter,"{#IFNAME}"],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
                and max(/Template_Linux_VPP/net.if.out.errors[node_exporter"{#IFNAME}"],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
              name: 'Interface {#IFNAME}: High error rate'
              event_name: 'Interface {#IFNAME}: High error rate (>{$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
              opdata: 'errors in: {ITEM.LASTVALUE1}, errors out: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'It recovers when it is below 80% of the `{$IF.ERRORS.WARN:"{#IFNAME}"}` threshold.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
          graph_prototypes:
            - uuid: c5a19024d4164b13a30390943848ddf3
              name: 'Interface {#IFNAME}): Network traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: Template_Linux_VPP
                    key: 'net.if.in[node_exporter,"{#IFNAME}"]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: F63100
                  item:
                    host: Template_Linux_VPP
                    key: 'net.if.out[node_exporter,"{#IFNAME}"]'
                - sortorder: '2'
                  color: 00611C
                  yaxisside: RIGHT
                  item:
                    host: Template_Linux_VPP
                    key: 'net.if.out.errors[node_exporter"{#IFNAME}"]'
                - sortorder: '3'
                  color: F7941D
                  yaxisside: RIGHT
                  item:
                    host: Template_Linux_VPP
                    key: 'net.if.in.errors[node_exporter,"{#IFNAME}"]'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          lld_macro_paths:
            - lld_macro: '{#IFNAME}'
              path: $..Interface.first()
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.NetworkSensors
        - uuid: 03a8ebb324e54170aa8c3af26c704cd5
