          value_type: FLOAT
          units: '%'
          params: '(last(//vm.memory.total[node_exporter])-last(//vm.memory.available[node_exporter]))/last(//vm.memory.total[node_exporter])*100'
          description: 'Memory used percentage is calculated as (total-available)/total*100.'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 36dd7c7a68b14be09ea764d46dd423fa
              expression: 'min(/Template_Linux_CaixaPostal/vm.memory.util[node_exporter],5m)>{$MEMORY.UTIL.MAX}'
              name: 'Linux: High memory utilization'
              event_name: 'Linux: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
              priority: AVERAGE
              description: 'The system is running out of free memory.'
              dependencies:
                - name: 'Linux: Lack of available memory'
                  expression: 'max(/Template_Linux_CaixaPostal/vm.memory.available[node_exporter],5m)<{$MEMORY.AVAILABLE.MIN} and last(/Template_Linux_CaixaPostal/vm.memory.total[node_exporter])>0'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: capacity
                - tag: scope
                  value: performance
      discovery_rules:
        - uuid: 001da803067b43e7bded90cc9663091d
          name: 'Network interface discovery'
          type: DEPENDENT
          key: 'net.if.discovery[node_exporter]'
          delay: '0'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery of network interfaces. Requires node_exporter v0.18 and up.'
          item_prototypes:
            - uuid: c8e6e43a62304cec96a61cefb186421e
              name: 'Interface {#IFNAME}: Erros'
              type: DEPENDENT
              key: 'net.errors[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''Errors/s''].first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 174d48357d874ae28334b326f81f8473
              name: 'Interface {#IFNAME}: Inbound packets'
              type: DEPENDENT
              key: 'net.if.in.errors[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''InTraffic pkps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 19f0773e09cf43d088985f731611ab1d
              name: 'Interface {#IFNAME}: Bits received'
              type: DEPENDENT
              key: 'net.if.in[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''InTraffic bps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 967367db8f5741ccbe056197050d3642
              name: 'Interface {#IFNAME}: Outbound packets'
              type: DEPENDENT
              key: 'net.if.out.errors[node_exporter"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@[''Interface''] == ''{#IFNAME}'')][''OutTraffic pkps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 29607e481ce2402a8254afb29728e7c8
              name: 'Interface {#IFNAME}: Bits sent'
              type: DEPENDENT
              key: 'net.if.out[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''OutTraffic bps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
          trigger_prototypes:
            - uuid: 31151a7b5364462ea41fc59c971e6f52
              expression: |
                min(/Template_Linux_CaixaPostal/net.if.in.errors[node_exporter,"{#IFNAME}"],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
                or min(/Template_Linux_CaixaPostal/net.if.out.errors[node_exporter"{#IFNAME}"],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                max(/Template_Linux_CaixaPostal/net.if.in.errors[node_exporter,"{#IFNAME}"],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
                and max(/Template_Linux_CaixaPostal/net.if.out.errors[node_exporter"{#IFNAME}"],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
              name: 'Interface {#IFNAME}: High error rate'
              event_name: 'Interface {#IFNAME}: High error rate (>{$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
              opdata: 'errors in: {ITEM.LASTVALUE1}, errors out: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'It recovers when it is below 80% of the `{$IF.ERRORS.WARN:"{#IFNAME}"}` threshold.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
          graph_prototypes:
            - uuid: 0b590b0d66c344db9189a4192c49548f
              name: 'Interface {#IFNAME}): Network traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: Template_Linux_CaixaPostal
                    key: 'net.if.in[node_exporter,"{#IFNAME}"]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: F63100
                  item:
                    host: Template_Linux_CaixaPostal
                    key: 'net.if.out[node_exporter,"{#IFNAME}"]'
                - sortorder: '2'
                  color: 00611C
                  yaxisside: RIGHT
                  item:
                    host: Template_Linux_CaixaPostal
                    key: 'net.if.out.errors[node_exporter"{#IFNAME}"]'
                - sortorder: '3'
                  color: F7941D
                  yaxisside: RIGHT
                  item:
                    host: Template_Linux_CaixaPostal
                    key: 'net.if.in.errors[node_exporter,"{#IFNAME}"]'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          lld_macro_paths:
            - lld_macro: '{#IFNAME}'
              path: $..Interface.first()
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.NetworkSensors
        - uuid: 1c5187366c02458f9d585e182f22e7e0
          name: 'Mounted filesystem discovery'
          type: DEPENDENT
          key: 'vfs.fs.discovery[node_exporter]'
          delay: '0'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery of file systems of different types.'
          item_prototypes:
            - uuid: 1f4e46f48aa5408c9bd2695c9a9328c1
              name: '{#DISK}: Free space'
              type: DEPENDENT
              key: 'vfs.fs.free[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Available.first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: filesystem
                  value: '{#DISK}'
            - uuid: f40928b3164741ae8d490b02b8474dfd
              name: '{#DISK}: Space utilization'
              type: DEPENDENT
              key: 'vfs.fs.pused[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: '%'
              description: 'The space utilization expressed in % for {#FSNAME}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Usage.first()'
                - type: TRIM
                  parameters:
                    - '%'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: filesystem
                  value: '{#DISK}'
            - uuid: 502e4e22567b434f863092cb49e16c77
              name: '{#DISK}: Total space'
              type: DEPENDENT
              key: 'vfs.fs.total[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              description: 'Total space in bytes'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Size.first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: filesystem
                  value: '{#DISK}'
            - uuid: 4fb6f7d7be854933b56e9dce16178282
              name: '{#DISK}: Used space'
              type: DEPENDENT
              key: 'vfs.fs.used[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              description: 'Used storage in bytes'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Used.first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: filesystem
                  value: '{#DISK}'
          trigger_prototypes:
            - uuid: 3cafbc2e7b4a42bf8351925d4fae8a9b
              expression: |
                last(/Template_Linux_CaixaPostal/vfs.fs.pused[node_exporter,"{#DISK}"])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"} and
                ((last(/Template_Linux_CaixaPostal/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_CaixaPostal/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"} or timeleft(/Template_Linux_CaixaPostal/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
              name: '{#FSNAME}: Disk space is critically low'
              event_name: '{#FSNAME}: Disk space is critically low (used > {$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}%)'
              opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
              priority: AVERAGE
              description: |
                Two conditions should match:
                1. The first condition - utilization of the space should be above `{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}`.
                2. The second condition should be one of the following:
                - the disk free space is less than `{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"}`;
                - the disk will be full in less than 24 hours.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: capacity
            - uuid: e58edda70d7d496a9f3886da34f60a37
              expression: |
                last(/Template_Linux_CaixaPostal/vfs.fs.pused[node_exporter,"{#DISK}"])>{$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"} and
                ((last(/Template_Linux_CaixaPostal/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_CaixaPostal/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.WARN:"{#FSNAME}"} or timeleft(/Template_Linux_CaixaPostal/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
              name: '{#FSNAME}: Disk space is low'
              event_name: '{#FSNAME}: Disk space is low (used > {$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"}%)'
              opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
              priority: WARNING
              description: |
                Two conditions should match:
                1. The first condition - utilization of the space should be above `{$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"}`.
                2. The second condition should be one of the following:
                - the disk free space is less than `{$VFS.FS.FREE.MIN.WARN:"{#FSNAME}"}`;
                - the disk will be full in less than 24 hours.
              manual_close: 'YES'
              dependencies:
                - name: '{#FSNAME}: Disk space is critically low'
                  expression: |
                    last(/Template_Linux_CaixaPostal/vfs.fs.pused[node_exporter,"{#DISK}"])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"} and
                    ((last(/Template_Linux_CaixaPostal/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_CaixaPostal/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"} or timeleft(/Template_Linux_CaixaPostal/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: capacity
          graph_prototypes:
            - uuid: d888145cc96f4b398fb0ee6ccf7afa44
              name: '{#DISK}: Disk space usage'
              width: '600'
              height: '340'
              yaxismax: '0'
              show_work_period: 'NO'
              show_triggers: 'NO'
              type: PIE
              show_3d: 'YES'
              graph_items:
                - color: '969696'
                  calc_fnc: LAST
                  type: GRAPH_SUM
                  item:
                    host: Template_Linux_CaixaPostal
                    key: 'vfs.fs.total[node_exporter,"{#DISK}"]'
                - sortorder: '1'
                  color: C80000
                  calc_fnc: LAST
                  item:
                    host: Template_Linux_CaixaPostal
                    key: 'vfs.fs.used[node_exporter,"{#DISK}"]'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          lld_macro_paths:
            - lld_macro: '{#DISK}'
              path: $.Mounted_on
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.DiskSensors.DiskInfo[*]'
