              manual_close: 'YES'
              dependencies:
                - name: 'Linux: System name has changed'
                  expression: 'last(/Template_Linux_VPP/system.name[node_exporter],#1)<>last(/Template_Linux_VPP/system.name[node_exporter],#2) and length(last(/Template_Linux_VPP/system.name[node_exporter]))>0'
