              priority: WARNING
              description: 'The CPU utilization is too high. The system might be slow to respond.'
              dependencies:
                - name: 'Linux: Load average is too high'
                  expression: |
                    min(/Template_Linux_Tas_Mas/system.cpu.load.avg1[node_exporter],5m)/last(/Template_Linux_Tas_Mas/system.cpu.num[node_exporter])>{$LOAD_AVG_PER_CPU.MAX.WARN}
                    and last(/Template_Linux_Tas_Mas/system.cpu.load.avg5[node_exporter])>0
                    and last(/Template_Linux_Tas_Mas/system.cpu.load.avg15[node_exporter])>0
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: performance
        - uuid: f18524a0d35647a89460916799bef5de
