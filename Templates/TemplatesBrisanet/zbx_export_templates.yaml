        - uuid: 8b811fd5dd5a4281a58d156addc4480f
          name: 'Json - ILICCE'
          key: 'system.run[python3 /etc/zabbix/scripts/convertILICCE.py /etc/zabbix/scripts/ILICCE_{$TAS_IP}.RCC,]'
          delay: 5m
          history: 7d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  
                  // lista de LICENCA que devem ser mantidas (com os números)
                  var keep = [
                      "56   Qtd. de MO1 com MO2 por Plano de Encaminhamento",
                      "85   Qtd. de CPCTs do Servico B_RAM",
                      "86   Qtd. de Numeros Telefonicos do servico B_RAM",
                      "87   Qtd. de Faixas Numericas por CPCT do Servico B_RAM",
                      "89   Qtd. de Numeros Telefonicos do Servico CASE",
                      "93   Qtd. Cadastros no Servico de Restricao - GAP",
                      "94   Qtd. Cadastros no Serv. Retencao - Fluxo Constante",
                      "95   Qtd. Cadastros no Servico de Restricao por PC",
                      "97   Qtd. CDR de Sistema de Gerencia de Trafego",
                      "98   Qtd. CDR para Analise de Sistema ANTIFRAUDE",
                      "102  Bloqueio de Transferencia de Chamadas a Cobrar",
                      "103  Qtd. Registros nos Relatorios da Aplicacao BTCC",
                      "120  Qtd. CDR para Portabilidade Numerica-PN1 X10**6",
                      "121  Qtd. CDR para Portabilidade Numerica-PN2 X10**6",
                      "142  Qtd. CDR Tipo NGN2",
                      "189  Qtd. de E1 no Equipamento",
                      "190  Qtd. de E1 por Tipo de Sinalizacao ISUP-IP",
                      "191  Qtd. de E1 por Tipo de Sinalizacao TUP-IP",
                      "259  CDR do Tipo Multif2"
                  ];
                  
                  // filtra somente os itens da lista
                  var filtered = data.filter(function(item) {
                      return keep.indexOf(item["LICENCA"].trim()) !== -1;
                  });
                  
                  // retorna apenas o JSON filtrado
                  return JSON.stringify(filtered);
          timeout: 3s
          tags:
            - tag: component
              value: raw
