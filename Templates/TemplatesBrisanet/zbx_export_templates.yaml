          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: system
        - uuid: 8a2d587284ae4f409bb9ef112f655136
          name: 'Linux: System name'
          type: DEPENDENT
          key: 'system.name[node_exporter]'
          delay: '0'
          history: 2w
          value_type: CHAR
          trends: '0'
          description: 'The host name of the system.'
          inventory_link: NAME
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''System Info''][''System Name'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: c669a2011b4945668834ceb5ce9cd1b3
              expression: 'last(/Template_Linux_VSS/system.name[node_exporter],#1)<>last(/Template_Linux_VSS/system.name[node_exporter],#2) and length(last(/Template_Linux_VSS/system.name[node_exporter]))>0'
              name: 'Linux: System name has changed'
              event_name: 'Linux: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'The name of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: notice
                - tag: scope
                  value: security
        - uuid: 5d55753ffb414c0b98eba650910ef904
          name: 'System Info'
          key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          delay: 3m
          history: 1h
          value_type: TEXT
          trends: '0'
          timeout: 30s
          tags:
            - tag: component
              value: raw
          triggers:
            - uuid: b5761f55dcd7463092a3c03dd43cf19a
              expression: 'nodata(/Template_Linux_VSS/system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},],30m)=1'
              name: 'Linux: node_exporter is not available'
              event_name: 'node_exporter is not available (or no data for 30m)'
              priority: WARNING
              description: 'Failed to fetch system metrics from node_exporter in time.'
              manual_close: 'YES'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: availability
        - uuid: dd56aa62b42742d6826f680eb1eccd8f
          name: 'Linux: Operating system'
          type: DEPENDENT
          key: 'system.sw.os[node_exporter]'
          delay: '0'
          history: 2w
          value_type: CHAR
          trends: '0'
          inventory_link: OS
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''System Info''][''System Description'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: os
          triggers:
            - uuid: a59291ea206f46e28841d5b3e886bd34
              expression: 'last(/Template_Linux_VSS/system.sw.os[node_exporter],#1)<>last(/Template_Linux_VSS/system.sw.os[node_exporter],#2) and length(last(/Template_Linux_VSS/system.sw.os[node_exporter]))>0'
              name: 'Linux: Operating system description has changed'
              priority: INFO
              description: 'The description of the operating system has changed. Possible reasons are that the system has been updated or replaced. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              dependencies:
                - name: 'Linux: System name has changed'
                  expression: 'last(/Template_Linux_VSS/system.name[node_exporter],#1)<>last(/Template_Linux_VSS/system.name[node_exporter],#2) and length(last(/Template_Linux_VSS/system.name[node_exporter]))>0'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: notice
        - uuid: b634d81b500f44918e0bf61b25ce3b88
          name: 'Linux: Free swap space'
          type: DEPENDENT
          key: 'system.swap.free[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: 'The free space of the swap volume/file expressed in bytes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Memory Metrics''][''Free Swap Space (Bytes)'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: memory
            - tag: component
              value: storage
        - uuid: 66237fbd0354444d9c6fd0baedc5ae01
          name: 'Linux: Free swap space in %'
          type: CALCULATED
          key: 'system.swap.pfree[node_exporter]'
          history: 7d
          value_type: FLOAT
          units: '%'
          params: 'last(//system.swap.free[node_exporter])/last(//system.swap.total[node_exporter])*100'
          description: 'The free space of the swap volume/file expressed in %.'
          tags:
            - tag: component
              value: memory
            - tag: component
              value: storage
        - uuid: a89f663d8bca4d12b5885ca0cfbde32f
          name: 'Linux: Total swap space'
          type: DEPENDENT
          key: 'system.swap.total[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: 'The total space of the swap volume/file expressed in bytes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Memory Metrics''][''Total Swap Space (Bytes)'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: memory
            - tag: component
              value: storage
        - uuid: 50cfc274b3b34e5293c1d74d9d8e5c44
          name: 'Linux: System uptime'
          type: DEPENDENT
          key: 'system.uptime[node_exporter]'
          delay: '0'
          history: 2w
          trends: '0'
          units: s
          description: 'The system uptime expressed in the following format: "N days, hh:mm:ss".'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''System Info''][''System Uptime'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 4418316f1ac648078f7c570d514563c0
              expression: 'last(/Template_Linux_VSS/system.uptime[node_exporter])<10m'
              name: 'Linux: {HOST.NAME} has been restarted'
              event_name: 'Linux: {HOST.NAME} has been restarted (uptime < 10m)'
              priority: WARNING
              description: 'The device uptime is less than 10 minutes.'
              manual_close: 'YES'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: notice
        - uuid: e7a5cb2b3af3458fa8b2d1ffad4b8139
          name: 'Linux: Available memory'
          type: DEPENDENT
          key: 'vm.memory.available[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: |
            The available memory:
            - in Linux - available = free + buffers + cache;
            - on other platforms calculation may vary.
            
            See also Appendixes in Zabbix Documentation about parameters of the `vm.memory.size` item.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Memory Metrics''][''Available Memory (Bytes)'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: memory
        - uuid: f1802be8625c425e840106e5480f4015
          name: 'Linux: Total memory'
          type: DEPENDENT
          key: 'vm.memory.total[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: 'The total memory expressed in bytes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Memory Metrics''][''Total Memory (Bytes)'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: memory
        - uuid: 815a430f8ab64c6b86c90ad2c72421c5
          name: 'Linux: Memory utilization'
          type: CALCULATED
          key: 'vm.memory.util[node_exporter]'
          history: 7d
          value_type: FLOAT
          units: '%'
          params: '(last(//vm.memory.total[node_exporter])-last(//vm.memory.available[node_exporter]))/last(//vm.memory.total[node_exporter])*100'
          description: 'Memory used percentage is calculated as (total-available)/total*100.'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: afd1fe8543f847fe92d032e6c08a887f
              expression: 'min(/Template_Linux_VSS/vm.memory.util[node_exporter],5m)>{$MEMORY.UTIL.MAX}'
              name: 'Linux: High memory utilization'
              event_name: 'Linux: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
              priority: AVERAGE
              description: 'The system is running out of free memory.'
              dependencies:
                - name: 'Linux: Lack of available memory'
                  expression: 'max(/Template_Linux_VSS/vm.memory.available[node_exporter],5m)<{$MEMORY.AVAILABLE.MIN} and last(/Template_Linux_VSS/vm.memory.total[node_exporter])>0'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: capacity
                - tag: scope
                  value: performance
      discovery_rules:
        - uuid: 1c77809a1f4549b586e4ad1fc4c742cb
          name: 'Network interface discovery'
          type: DEPENDENT
          key: 'net.if.discovery[node_exporter]'
          delay: '0'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery of network interfaces. Requires node_exporter v0.18 and up.'
          item_prototypes:
            - uuid: 5a3c2ff0a98d413a800933919d513a4a
              name: 'Interface {#IFNAME}: Erros'
              type: DEPENDENT
              key: 'net.errors[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''Errors/s''].first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 222dbd74c63c48799389353991604f42
              name: 'Interface {#IFNAME}: Inbound packets'
              type: DEPENDENT
              key: 'net.if.in.errors[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''InTraffic pkps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 4980839d677040d697a77b9071dca3a9
              name: 'Interface {#IFNAME}: Bits received'
              type: DEPENDENT
              key: 'net.if.in[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''InTraffic bps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 0f60e2f004a249458117f01cd2418903
              name: 'Interface {#IFNAME}: Outbound packets'
              type: DEPENDENT
              key: 'net.if.out.errors[node_exporter"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@[''Interface''] == ''{#IFNAME}'')][''OutTraffic pkps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 47a78c08eac54ec19ec5770114ae2b37
              name: 'Interface {#IFNAME}: Bits sent'
              type: DEPENDENT
              key: 'net.if.out[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''OutTraffic bps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
          trigger_prototypes:
            - uuid: 0d7c69b51e3a454ba55ea74a5d120b66
              expression: |
                min(/Template_Linux_VSS/net.if.in.errors[node_exporter,"{#IFNAME}"],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
                or min(/Template_Linux_VSS/net.if.out.errors[node_exporter"{#IFNAME}"],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                max(/Template_Linux_VSS/net.if.in.errors[node_exporter,"{#IFNAME}"],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
                and max(/Template_Linux_VSS/net.if.out.errors[node_exporter"{#IFNAME}"],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
              name: 'Interface {#IFNAME}: High error rate'
              event_name: 'Interface {#IFNAME}: High error rate (>{$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
              opdata: 'errors in: {ITEM.LASTVALUE1}, errors out: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'It recovers when it is below 80% of the `{$IF.ERRORS.WARN:"{#IFNAME}"}` threshold.'
              manual_close: 'YES'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
          graph_prototypes:
            - uuid: 0b9d0db515ec4e5f8d4e41468bf1d66a
              name: 'Interface {#IFNAME}): Network traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: Template_Linux_VSS
                    key: 'net.if.in[node_exporter,"{#IFNAME}"]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: F63100
                  item:
                    host: Template_Linux_VSS
                    key: 'net.if.out[node_exporter,"{#IFNAME}"]'
                - sortorder: '2'
                  color: 00611C
                  yaxisside: RIGHT
                  item:
                    host: Template_Linux_VSS
                    key: 'net.if.out.errors[node_exporter"{#IFNAME}"]'
                - sortorder: '3'
                  color: F7941D
                  yaxisside: RIGHT
                  item:
                    host: Template_Linux_VSS
                    key: 'net.if.in.errors[node_exporter,"{#IFNAME}"]'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          lld_macro_paths:
            - lld_macro: '{#IFNAME}'
              path: $..Interface.first()
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.NetworkSensors
        - uuid: 04a3d3bb828d473c96f7464ccc9d6060
          name: 'Mounted filesystem discovery'
          type: DEPENDENT
          key: 'vfs.fs.discovery[node_exporter]'
          delay: '0'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery of file systems of different types.'
          item_prototypes:
            - uuid: 449e4e30ef464a42942de77eb5ae795e
              name: '{#DISK}: Free space'
              type: DEPENDENT
              key: 'vfs.fs.free[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Available.first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: filesystem
                  value: '{#DISK}'
            - uuid: d85f82e521e442fe8ada20cc6fd46e74
              name: '{#DISK}: Space utilization'
              type: DEPENDENT
              key: 'vfs.fs.pused[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: '%'
              description: 'The space utilization expressed in % for {#FSNAME}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Usage.first()'
                - type: TRIM
                  parameters:
                    - '%'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: filesystem
                  value: '{#DISK}'
            - uuid: ec049fed44ce406e836e35989f5e04ca
              name: '{#DISK}: Total space'
              type: DEPENDENT
              key: 'vfs.fs.total[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              description: 'Total space in bytes'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Size.first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: filesystem
                  value: '{#DISK}'
            - uuid: 22b3d93618ad4598be511e5ada109b24
              name: '{#DISK}: Used space'
              type: DEPENDENT
              key: 'vfs.fs.used[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              description: 'Used storage in bytes'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Used.first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: filesystem
                  value: '{#DISK}'
          trigger_prototypes:
            - uuid: 959abc4c4a7b4a9f970df1ab8ea82ed4
              expression: |
                last(/Template_Linux_VSS/vfs.fs.pused[node_exporter,"{#DISK}"])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"} and
                ((last(/Template_Linux_VSS/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_VSS/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"} or timeleft(/Template_Linux_VSS/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
              name: '{#FSNAME}: Disk space is critically low'
              event_name: '{#FSNAME}: Disk space is critically low (used > {$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}%)'
              opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
              priority: AVERAGE
              description: |
                Two conditions should match:
                1. The first condition - utilization of the space should be above `{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}`.
                2. The second condition should be one of the following:
                - the disk free space is less than `{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"}`;
                - the disk will be full in less than 24 hours.
              manual_close: 'YES'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: availability
                - tag: scope
                  value: capacity
            - uuid: 3e72350e6bb445aebee971def04deca9
              expression: |
                last(/Template_Linux_VSS/vfs.fs.pused[node_exporter,"{#DISK}"])>{$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"} and
                ((last(/Template_Linux_VSS/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_VSS/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.WARN:"{#FSNAME}"} or timeleft(/Template_Linux_VSS/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
              name: '{#FSNAME}: Disk space is low'
              event_name: '{#FSNAME}: Disk space is low (used > {$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"}%)'
              opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
              priority: WARNING
              description: |
                Two conditions should match:
                1. The first condition - utilization of the space should be above `{$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"}`.
                2. The second condition should be one of the following:
                - the disk free space is less than `{$VFS.FS.FREE.MIN.WARN:"{#FSNAME}"}`;
                - the disk will be full in less than 24 hours.
              manual_close: 'YES'
              dependencies:
                - name: '{#FSNAME}: Disk space is critically low'
                  expression: |
                    last(/Template_Linux_VSS/vfs.fs.pused[node_exporter,"{#DISK}"])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"} and
                    ((last(/Template_Linux_VSS/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_VSS/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"} or timeleft(/Template_Linux_VSS/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: availability
                - tag: scope
                  value: capacity
          graph_prototypes:
            - uuid: f3dd6aa42c664c64badc657c47217e9b
              name: '{#DISK}: Disk space usage'
              width: '600'
              height: '340'
              yaxismax: '0'
              show_work_period: 'NO'
              show_triggers: 'NO'
              type: PIE
              show_3d: 'YES'
              graph_items:
                - color: '969696'
                  calc_fnc: LAST
                  type: GRAPH_SUM
                  item:
                    host: Template_Linux_VSS
                    key: 'vfs.fs.total[node_exporter,"{#DISK}"]'
                - sortorder: '1'
                  color: C80000
                  calc_fnc: LAST
                  item:
                    host: Template_Linux_VSS
                    key: 'vfs.fs.used[node_exporter,"{#DISK}"]'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          lld_macro_paths:
            - lld_macro: '{#DISK}'
              path: $.Mounted_on
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.DiskSensors.DiskInfo[*]'
      tags:
        - tag: class
          value: os
        - tag: target
          value: linux
      macros:
        - macro: '{$CPU.UTIL.CRIT}'
          value: '90'
        - macro: '{$IF.ERRORS.WARN}'
          value: '2'
        - macro: '{$IF.UTIL.MAX}'
          value: '90'
        - macro: '{$IFCONTROL}'
