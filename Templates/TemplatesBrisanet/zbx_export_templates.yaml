              value: system
          triggers:
            - uuid: 53f32f089ac7435a9ac932eb2198070e
              expression: 'last(/Template_Linux_MAS_TAS/system.name[node_exporter],#1)<>last(/Template_Linux_MAS_TAS/system.name[node_exporter],#2) and length(last(/Template_Linux_MAS_TAS/system.name[node_exporter]))>0'
              name: 'Linux: System name has changed'
              event_name: 'Linux: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'The name of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: notice
                - tag: scope
                  value: security
        - uuid: 7ffa8f3f57484972b44436a125ca9b00
