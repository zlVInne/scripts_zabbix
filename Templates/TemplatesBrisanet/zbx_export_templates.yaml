        - uuid: 7573313c38cc4dc1ac71da6724fa93c6
          name: 'Linux: System uptime'
          type: DEPENDENT
          key: 'system.uptime[node_exporter]'
          delay: '0'
          history: 2w
          trends: '0'
          units: s
          description: 'The system uptime expressed in the following format: "N days, hh:mm:ss".'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''System Info''][''System Uptime'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
          tags:
