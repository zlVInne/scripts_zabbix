          key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
          delay: 3m
          history: 1h
          value_type: TEXT
          trends: '0'
          timeout: 3s
          tags:
            - tag: component
              value: raw
          triggers:
            - uuid: 801be82c567e4366a8aa05dd5b38a43d
              expression: 'nodata(/Template_Linux_MAS_TAS/system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},],30m)=1'
              name: 'Linux: node_exporter is not available'
              event_name: 'node_exporter is not available (or no data for 30m)'
              priority: WARNING
              description: 'Failed to fetch system metrics from node_exporter in time.'
