      discovery_rules:
        - uuid: 0ead5d8ff92043f28d1429181facb6d7
          name: 'Prometheus - CPU Container'
          type: DEPENDENT
          key: prometheus.cpu.usage
          delay: '0'
          item_prototypes:
            - uuid: 40eeeb2e8e094b08b62ba08c74c5e554
              name: 'CPU utilization % - {#NAME}'
              type: DEPENDENT
              key: 'container.cpu.usage[{#NAME}]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              trends: 30d
              units: '%'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var results = data.data.result;
                      for (var i = 0; i < results.length; i++) {
                        if (results[i].metric.name === '{#NAME}') {
                          return results[i].value[1];
                        }
                      }
                      return null;
              master_item:
                key: prometheus.cpu.discovery
              tags:
                - tag: CPU
                  value: Container
            - uuid: 3a57feb582704b9491a93084f9099258
              name: 'Disk utilization - {#NAME}'
