            - uuid: 1f96903b2db9414fb2b7c7ec9c1beabf
              expression: |
                last(/Template_Linux_MAS_VSS/vfs.fs.pused[node_exporter,"{#DISK}"])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"} and
                ((last(/Template_Linux_MAS_VSS/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_MAS_VSS/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"} or timeleft(/Template_Linux_MAS_VSS/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
              name: '{#FSNAME}: Disk space is critically low'
              event_name: '{#FSNAME}: Disk space is critically low (used > {$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}%)'
              opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
              priority: AVERAGE
              description: |
                Two conditions should match:
                1. The first condition - utilization of the space should be above `{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}`.
                2. The second condition should be one of the following:
                - the disk free space is less than `{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"}`;
                - the disk will be full in less than 24 hours.
              manual_close: 'YES'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: availability
                - tag: scope
                  value: capacity
