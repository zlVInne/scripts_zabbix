              value: system
          triggers:
            - uuid: ef1fbec3077d4ab499a17cb5b2ad7346
              expression: 'last(/Template_Linux_MAS_VSS/kernel.maxfiles[node_exporter])<{$KERNEL.MAXFILES.MIN}'
              name: 'Linux: Configured max number of open filedescriptors is too low'
              event_name: 'Linux: Configured max number of open filedescriptors is too low (< {$KERNEL.MAXFILES.MIN})'
              priority: INFO
              dependencies:
                - name: 'Linux: Running out of file descriptors'
                  expression: 'last(/Template_Linux_MAS_VSS/fd.open[node_exporter])/last(/Template_Linux_MAS_VSS/kernel.maxfiles[node_exporter])*100>80'
              tags:
                - tag: alerta
