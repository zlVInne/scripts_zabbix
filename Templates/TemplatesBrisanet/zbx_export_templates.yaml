                  value: infra
                - tag: scope
                  value: availability
        - uuid: 3f0e1d91f6964c8298a08a895aa44201
          name: 'Linux: System local time'
          type: DEPENDENT
          key: 'system.localtime[node_exporter]'
          delay: '0'
          history: 7d
          value_type: CHAR
          trends: '0'
