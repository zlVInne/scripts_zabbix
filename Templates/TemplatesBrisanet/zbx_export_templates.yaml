        - uuid: 6ee930ef8d59486bb150b7dd9cda16f1
          name: 'Json - IECEBA'
          key: 'system.run[python3 /etc/zabbix/scripts/convertIECEBA.py /etc/zabbix/scripts/IECEBA_{$TAS_IP}.RCC,]'
          delay: 15m
          history: 7d
