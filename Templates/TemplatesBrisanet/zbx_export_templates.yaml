              parameters:
                - '$.[''System Info''][''System Local Time'']'
          master_item:
            key: system.info
          tags:
            - tag: component
              value: system
        - uuid: ac0471305a9242458b644f9589f71fbe
          name: 'Linux: System name'
          type: DEPENDENT
          key: 'system.name[node_exporter]'
          delay: '0'
          history: 2w
          value_type: CHAR
          trends: '0'
          description: 'The host name of the system.'
          inventory_link: NAME
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''System Info''][''System Name'']'
          master_item:
            key: system.info
          tags:
            - tag: component
