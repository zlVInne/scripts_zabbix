            - uuid: 5e4db6a79ce8413ab0e6dca34bb90fd6
              name: 'Memory utilization - {#NAME}'
              type: DEPENDENT
              key: 'container.memory.usage[{#NAME}]'
              delay: '0'
              history: 7d
              trends: 30d
              units: B
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var results = data.data.result;
                      for (var i = 0; i < results.length; i++) {
                        if (results[i].metric.name === '{#NAME}') {
                          return results[i].value[1];
                        }
                      }
                      return null;
              master_item:
                key: prometheus.memory.discovery
              tags:
                - tag: Memory
