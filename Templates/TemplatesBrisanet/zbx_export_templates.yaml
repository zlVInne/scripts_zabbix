              value: os
          triggers:
            - uuid: 7b34eefdc5104dd7a1dda5990951dc4a
              expression: 'last(/Template_Linux_Tas_Mas/system.sw.os[node_exporter],#1)<>last(/Template_Linux_Tas_Mas/system.sw.os[node_exporter],#2) and length(last(/Template_Linux_Tas_Mas/system.sw.os[node_exporter]))>0'
              name: 'Linux: Operating system description has changed'
              priority: INFO
              description: 'The description of the operating system has changed. Possible reasons are that the system has been updated or replaced. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              dependencies:
                - name: 'Linux: System name has changed'
                  expression: 'last(/Template_Linux_Tas_Mas/system.name[node_exporter],#1)<>last(/Template_Linux_Tas_Mas/system.name[node_exporter],#2) and length(last(/Template_Linux_Tas_Mas/system.name[node_exporter]))>0'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: notice
        - uuid: 492abacc6f4e4954a7c4d48bfbba2852
          name: 'Linux: Free swap space'
          type: DEPENDENT
          key: 'system.swap.free[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: 'The free space of the swap volume/file expressed in bytes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Memory Metrics''][''Free Swap Space (Bytes)'']'
          master_item:
            key: system.info
          tags:
            - tag: component
              value: memory
            - tag: component
              value: storage
        - uuid: 0cb22475a98e43f1b472be5442153115
          name: 'Linux: Free swap space in %'
          type: CALCULATED
          key: 'system.swap.pfree[node_exporter]'
          history: 7d
          value_type: FLOAT
          units: '%'
          params: 'last(//system.swap.free[node_exporter])/last(//system.swap.total[node_exporter])*100'
          description: 'The free space of the swap volume/file expressed in %.'
          tags:
            - tag: component
              value: memory
            - tag: component
              value: storage
        - uuid: 0b428af027064834b4b783c29d062f47
          name: 'Linux: Total swap space'
          type: DEPENDENT
          key: 'system.swap.total[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: 'The total space of the swap volume/file expressed in bytes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Memory Metrics''][''Total Swap Space (Bytes)'']'
          master_item:
            key: system.info
          tags:
            - tag: component
              value: memory
            - tag: component
              value: storage
        - uuid: 028d659379e54681b920a21858372e60
          name: 'Linux: System uptime'
          type: DEPENDENT
          key: 'system.uptime[node_exporter]'
          delay: '0'
          history: 2w
          trends: '0'
          units: s
          description: 'The system uptime expressed in the following format: "N days, hh:mm:ss".'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''System Info''][''System Uptime'']'
          master_item:
            key: system.info
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: e5da65c90c7441b0bf7c6eb058e6bd89
              expression: 'last(/Template_Linux_Tas_Mas/system.uptime[node_exporter])<10m'
              name: 'Linux: {HOST.NAME} has been restarted'
              event_name: 'Linux: {HOST.NAME} has been restarted (uptime < 10m)'
              priority: WARNING
              description: 'The device uptime is less than 10 minutes.'
              manual_close: 'YES'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: notice
        - uuid: a8f4dd3d24294f1ea4551b80d9f8f8b2
          name: 'Linux: Available memory'
          type: DEPENDENT
          key: 'vm.memory.available[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: |
            The available memory:
            - in Linux - available = free + buffers + cache;
            - on other platforms calculation may vary.
            
            See also Appendixes in Zabbix Documentation about parameters of the `vm.memory.size` item.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Memory Metrics''][''Available Memory (Bytes)'']'
          master_item:
            key: system.info
          tags:
            - tag: component
              value: memory
        - uuid: 9d61f9e42ab94446a5bfb5cb2a8bcffb
          name: 'Linux: Total memory'
          type: DEPENDENT
          key: 'vm.memory.total[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: 'The total memory expressed in bytes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Memory Metrics''][''Total Memory (Bytes)'']'
          master_item:
            key: system.info
          tags:
            - tag: component
              value: memory
        - uuid: 57a1b3eee9f64ae785f9c78990c375e5
          name: 'Linux: Memory utilization'
          type: CALCULATED
          key: 'vm.memory.util[node_exporter]'
          history: 7d
          value_type: FLOAT
          units: '%'
          params: '(last(//vm.memory.total[node_exporter])-last(//vm.memory.available[node_exporter]))/last(//vm.memory.total[node_exporter])*100'
          description: 'Memory used percentage is calculated as (total-available)/total*100.'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 860b0e662d914247bd6ff592fdbde989
              expression: 'min(/Template_Linux_Tas_Mas/vm.memory.util[node_exporter],5m)>{$MEMORY.UTIL.MAX}'
              name: 'Linux: High memory utilization'
              event_name: 'Linux: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
              priority: AVERAGE
              description: 'The system is running out of free memory.'
              dependencies:
                - name: 'Linux: Lack of available memory'
                  expression: 'max(/Template_Linux_Tas_Mas/vm.memory.available[node_exporter],5m)<{$MEMORY.AVAILABLE.MIN} and last(/Template_Linux_Tas_Mas/vm.memory.total[node_exporter])>0'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: capacity
                - tag: scope
                  value: performance
      discovery_rules:
        - uuid: 545d7bbcb26a49818fe8c8b569abbc07
          name: 'Network interface discovery'
          type: DEPENDENT
          key: 'net.if.discovery[node_exporter]'
          delay: '0'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery of network interfaces. Requires node_exporter v0.18 and up.'
          item_prototypes:
            - uuid: 4edf58de76a74d7ab165de053ca33f33
              name: 'Interface {#IFNAME}: Erros'
              type: DEPENDENT
              key: 'net.errors[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''Errors/s''].first()'
              master_item:
                key: system.info
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 1979a726f27f482687d51976a5521f8c
              name: 'Interface {#IFNAME}: Inbound packets'
              type: DEPENDENT
              key: 'net.if.in.errors[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''InTraffic pkps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: system.info
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 562c6f4ba06c4dbfa7648aeda77b73b0
              name: 'Interface {#IFNAME}: Bits received'
              type: DEPENDENT
              key: 'net.if.in[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''InTraffic bps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: system.info
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 614840e5bcbf4e5fa600c97331248bf3
              name: 'Interface {#IFNAME}: Outbound packets'
              type: DEPENDENT
              key: 'net.if.out.errors[node_exporter"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@[''Interface''] == ''{#IFNAME}'')][''OutTraffic pkps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: system.info
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: efa972111ef34b18b9e759320269f9f2
              name: 'Interface {#IFNAME}: Bits sent'
              type: DEPENDENT
              key: 'net.if.out[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''OutTraffic bps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: system.info
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
          trigger_prototypes:
            - uuid: cbdb4c3b9e93447781a88dab481a30d8
              expression: |
                min(/Template_Linux_Tas_Mas/net.if.in.errors[node_exporter,"{#IFNAME}"],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
                or min(/Template_Linux_Tas_Mas/net.if.out.errors[node_exporter"{#IFNAME}"],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                max(/Template_Linux_Tas_Mas/net.if.in.errors[node_exporter,"{#IFNAME}"],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
                and max(/Template_Linux_Tas_Mas/net.if.out.errors[node_exporter"{#IFNAME}"],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
              name: 'Interface {#IFNAME}: High error rate'
              event_name: 'Interface {#IFNAME}: High error rate (>{$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
              opdata: 'errors in: {ITEM.LASTVALUE1}, errors out: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'It recovers when it is below 80% of the `{$IF.ERRORS.WARN:"{#IFNAME}"}` threshold.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
          graph_prototypes:
            - uuid: e2abe687bcde4a4b8dd2216e218dd44f
              name: 'Interface {#IFNAME}): Network traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: Template_Linux_Tas_Mas
                    key: 'net.if.in[node_exporter,"{#IFNAME}"]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: F63100
                  item:
                    host: Template_Linux_Tas_Mas
                    key: 'net.if.out[node_exporter,"{#IFNAME}"]'
                - sortorder: '2'
                  color: 00611C
                  yaxisside: RIGHT
                  item:
                    host: Template_Linux_Tas_Mas
                    key: 'net.if.out.errors[node_exporter"{#IFNAME}"]'
                - sortorder: '3'
                  color: F7941D
                  yaxisside: RIGHT
                  item:
                    host: Template_Linux_Tas_Mas
                    key: 'net.if.in.errors[node_exporter,"{#IFNAME}"]'
          master_item:
            key: system.info
          lld_macro_paths:
            - lld_macro: '{#IFNAME}'
              path: $..Interface.first()
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.NetworkSensors
        - uuid: 3fe4cb496b0e434db559ea82c6cbc0d5
          name: 'Mounted filesystem discovery'
          type: DEPENDENT
          key: 'vfs.fs.discovery[node_exporter]'
          delay: '0'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery of file systems of different types.'
          item_prototypes:
            - uuid: ba422b0f6aeb4c3c9ffd7b50bfb31d53
              name: '{#DISK}: Free space'
              type: DEPENDENT
              key: 'vfs.fs.free[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Available.first()'
              master_item:
                key: system.info
              tags:
                - tag: filesystem
                  value: '{#DISK}'
            - uuid: 6fc1cc5c326647e9a15b9f0cba020d7c
              name: '{#DISK}: Space utilization'
              type: DEPENDENT
              key: 'vfs.fs.pused[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: '%'
              description: 'The space utilization expressed in % for {#FSNAME}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Usage.first()'
                - type: TRIM
                  parameters:
                    - '%'
              master_item:
                key: system.info
              tags:
                - tag: filesystem
                  value: '{#DISK}'
            - uuid: d244b97b8fca4c218137b0ac1720f92b
              name: '{#DISK}: Total space'
              type: DEPENDENT
              key: 'vfs.fs.total[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              description: 'Total space in bytes'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Size.first()'
              master_item:
                key: system.info
              tags:
                - tag: filesystem
                  value: '{#DISK}'
            - uuid: d59317eadc0448648f33ecd465193504
              name: '{#DISK}: Used space'
              type: DEPENDENT
              key: 'vfs.fs.used[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              description: 'Used storage in bytes'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Used.first()'
              master_item:
                key: system.info
              tags:
                - tag: filesystem
                  value: '{#DISK}'
          trigger_prototypes:
            - uuid: db05e5f8434740f891740971d5c471d0
              expression: |
                last(/Template_Linux_Tas_Mas/vfs.fs.pused[node_exporter,"{#DISK}"])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"} and
                ((last(/Template_Linux_Tas_Mas/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_Tas_Mas/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"} or timeleft(/Template_Linux_Tas_Mas/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
              name: '{#FSNAME}: Disk space is critically low'
              event_name: '{#FSNAME}: Disk space is critically low (used > {$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}%)'
              opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
              priority: AVERAGE
              description: |
                Two conditions should match:
                1. The first condition - utilization of the space should be above `{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}`.
                2. The second condition should be one of the following:
                - the disk free space is less than `{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"}`;
                - the disk will be full in less than 24 hours.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: capacity
            - uuid: 8550f513ab90460c9c7681e3cafbee81
              expression: |
                last(/Template_Linux_Tas_Mas/vfs.fs.pused[node_exporter,"{#DISK}"])>{$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"} and
                ((last(/Template_Linux_Tas_Mas/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_Tas_Mas/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.WARN:"{#FSNAME}"} or timeleft(/Template_Linux_Tas_Mas/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
              name: '{#FSNAME}: Disk space is low'
              event_name: '{#FSNAME}: Disk space is low (used > {$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"}%)'
              opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
              priority: WARNING
              description: |
                Two conditions should match:
                1. The first condition - utilization of the space should be above `{$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"}`.
                2. The second condition should be one of the following:
                - the disk free space is less than `{$VFS.FS.FREE.MIN.WARN:"{#FSNAME}"}`;
                - the disk will be full in less than 24 hours.
              manual_close: 'YES'
              dependencies:
                - name: '{#FSNAME}: Disk space is critically low'
                  expression: |
                    last(/Template_Linux_Tas_Mas/vfs.fs.pused[node_exporter,"{#DISK}"])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"} and
                    ((last(/Template_Linux_Tas_Mas/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_Tas_Mas/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"} or timeleft(/Template_Linux_Tas_Mas/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: capacity
