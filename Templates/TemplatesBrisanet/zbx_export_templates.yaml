        - uuid: 12b1ec691cd84f95bf3ba5a4af508e76
          name: 'Mounted filesystem discovery'
          type: DEPENDENT
          key: 'vfs.fs.discovery[node_exporter]'
          delay: '0'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery of file systems of different types.'
          item_prototypes:
            - uuid: 7402bbcfb6a84fbf89faa63906ae0dcb
              name: '{#DISK}: Free space'
              type: DEPENDENT
              key: 'vfs.fs.free[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Available.first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
              tags:
                - tag: filesystem
                  value: '{#DISK}'
            - uuid: c6e6c12ee6db40cbb6e92f3ca75e9c8b
              name: '{#DISK}: Space utilization'
              type: DEPENDENT
              key: 'vfs.fs.pused[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: '%'
              description: 'The space utilization expressed in % for {#FSNAME}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Usage.first()'
                - type: TRIM
                  parameters:
                    - '%'
              master_item:
                key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
              tags:
                - tag: filesystem
                  value: '{#DISK}'
            - uuid: 443b21152e8742aeb435d9c96fbc056e
              name: '{#DISK}: Total space'
              type: DEPENDENT
              key: 'vfs.fs.total[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              description: 'Total space in bytes'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Size.first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
              tags:
                - tag: filesystem
                  value: '{#DISK}'
            - uuid: c54835d5558f4497a0b04173c05793db
              name: '{#DISK}: Used space'
              type: DEPENDENT
              key: 'vfs.fs.used[node_exporter,"{#DISK}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              description: 'Used storage in bytes'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''DiskSensors''][''DiskInfo''][?(@[''Mounted_on''] == ''{#DISK}'')].Used.first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
              tags:
                - tag: filesystem
                  value: '{#DISK}'
          trigger_prototypes:
            - uuid: 47e002b38c0a473296e0f209cf4af044
              expression: |
                last(/Template_Linux_MAS_TAS/vfs.fs.pused[node_exporter,"{#DISK}"])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"} and
                ((last(/Template_Linux_MAS_TAS/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_MAS_TAS/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"} or timeleft(/Template_Linux_MAS_TAS/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
              name: '{#FSNAME}: Disk space is critically low'
              event_name: '{#FSNAME}: Disk space is critically low (used > {$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}%)'
              opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
              priority: AVERAGE
              description: |
                Two conditions should match:
                1. The first condition - utilization of the space should be above `{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"}`.
                2. The second condition should be one of the following:
                - the disk free space is less than `{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"}`;
                - the disk will be full in less than 24 hours.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: capacity
            - uuid: 59b39b109e084667bb882505d9b04327
              expression: |
                last(/Template_Linux_MAS_TAS/vfs.fs.pused[node_exporter,"{#DISK}"])>{$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"} and
                ((last(/Template_Linux_MAS_TAS/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_MAS_TAS/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.WARN:"{#FSNAME}"} or timeleft(/Template_Linux_MAS_TAS/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
              name: '{#FSNAME}: Disk space is low'
              event_name: '{#FSNAME}: Disk space is low (used > {$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"}%)'
              opdata: 'Space used: {ITEM.LASTVALUE3} of {ITEM.LASTVALUE2} ({ITEM.LASTVALUE1})'
              priority: WARNING
              description: |
                Two conditions should match:
                1. The first condition - utilization of the space should be above `{$VFS.FS.PUSED.MAX.WARN:"{#FSNAME}"}`.
                2. The second condition should be one of the following:
                - the disk free space is less than `{$VFS.FS.FREE.MIN.WARN:"{#FSNAME}"}`;
                - the disk will be full in less than 24 hours.
              manual_close: 'YES'
              dependencies:
                - name: '{#FSNAME}: Disk space is critically low'
                  expression: |
                    last(/Template_Linux_MAS_TAS/vfs.fs.pused[node_exporter,"{#DISK}"])>{$VFS.FS.PUSED.MAX.CRIT:"{#FSNAME}"} and
                    ((last(/Template_Linux_MAS_TAS/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_MAS_TAS/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.CRIT:"{#FSNAME}"} or timeleft(/Template_Linux_MAS_TAS/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: capacity
