                    - '$[?(@.PRO=={#PRO})].SERVICOS[?(@.SERVICO==''{#SERVICO}'')].PERIODO5.first()'
              master_item:
                key: 'system.run[python3 /etc/zabbix/scripts/convertNMSIDADDS.py /etc/zabbix/scripts/NMSIDADDS_{$VSI_IP}.RES,]'
              tags:
                - tag: Application
                  value: NMSIDADDS
          master_item:
            key: 'system.run[python3 /etc/zabbix/scripts/convertNMSIDADDS.py /etc/zabbix/scripts/NMSIDADDS_{$VSI_IP}.RES,]'
          lld_macro_paths:
            - lld_macro: '{#PRO}'
              path: $..PRO.first()
            - lld_macro: '{#SERVICO}'
              path: $..SERVICO.first()
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var discovery = [];
                  
                  data.forEach(function(proBlock) {
                      var pro = proBlock.PRO;
                  
                      proBlock.SERVICOS.forEach(function(servicoItem) {
                          discovery.push({
                              "PRO": pro,
                              "SERVICO": servicoItem.SERVICO
                          });
                      });
                  });
                  
                  return JSON.stringify({ data: discovery });
