    - uuid: 21480b27ad244824a406cd53afd6bf6d
      template: Template_Linux_CaixaPostal
      name: Template_Linux_CaixaPostal
      groups:
        - name: CaixaPostal
        - name: 'Templates/Operating systems'
      items:
        - uuid: 78d99c7f41a342fa8269885bf2893ff6
          name: 'Linux: Number of open file descriptors'
          type: DEPENDENT
          key: 'fd.open[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Miscellaneous Sensors''][''Number of Open File Descriptors'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: system
        - uuid: 61b6ca70f2cb4691bd6f6aecaf2a8998
          name: 'Linux: Maximum number of open file descriptors'
          type: DEPENDENT
          key: 'kernel.maxfiles[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          description: 'It could be increased by using `sysctl` utility or modifying the file `/etc/sysctl.conf`.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Miscellaneous Sensors''][''Maximum Number of Open File Descriptors'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 2b9c48ac378e447ca914e682690f7289
              expression: 'last(/Template_Linux_CaixaPostal/kernel.maxfiles[node_exporter])<{$KERNEL.MAXFILES.MIN}'
              name: 'Linux: Configured max number of open filedescriptors is too low'
              event_name: 'Linux: Configured max number of open filedescriptors is too low (< {$KERNEL.MAXFILES.MIN})'
              priority: INFO
              dependencies:
                - name: 'Linux: Running out of file descriptors'
                  expression: 'last(/Template_Linux_CaixaPostal/fd.open[node_exporter])/last(/Template_Linux_CaixaPostal/kernel.maxfiles[node_exporter])*100>80'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: performance
