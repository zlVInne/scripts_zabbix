        - uuid: 90a00d1c5bae4686899c6c111beeb95f
          name: 'Json - ILICCE'
          key: 'system.run[python3 /etc/zabbix/scripts/convertILICCE.py /etc/zabbix/scripts/ILICCE_{$VSS_IP}.RCC,]'
          delay: 5m
          history: 7d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  
                  // lista de LICENCA que devem ser mantidas
                  var keep = [
                      "Processadores de Protocolo H.248",
                      "Qtd. de Maquinas Anunciadoras",
                      "Processadores de Protocolo INAP-RI",
                      "Processadores de Assinantes Digitais",
                      "Processadores de Sinalizacao de Canal Comum #7",
                      "Processadores de Sinalizacao ISUP-IP",
                      "Qtd. Cadastros no Servico CCT-CTPE",
                      "Qtd. Cadastros no Servico CCT-INAD",
                      "Qtd. Cadastros no Servico CCT-ANTFR",
                      "Qtd. Cadastros no Servico CCT-FIDELI",
                      "Quantidade de Enlaces SCC #7",
                      "Capacidade para Grupo de Juntor SIP",
                      "Capacidade para Grupo de Juntor SIPT",
                      "Processadores de Sinalizacao M2PA",
                      "Qtd. de APC com Funcao SCCP_OUT",
                      "Qtd. de APC com Funcao JUN-VOZ",
                      "Qtd. de Redes SCC#7 Criadas na Plataforma",
                      "Processadores de Sinalizacao Sigtran-M2UA",
                      "Qtd. de Enlaces M2PA na Plataforma",
                      "Qtd. de Enlaces M2UA na Plataforma",
                      "Qtd. de Enlaces TDM na Plataforma",
                      "Numero Maximo de Processadores Virtuais"
                  ];
                  
                  // filtra somente os itens da lista
                  var filtered = data.filter(function(item) {
                      return keep.indexOf(item["LICENCA"].trim()) !== -1;
                  });
                  
                  // retorna apenas o JSON filtrado
                  return JSON.stringify(filtered);
          timeout: 30s
          tags:
            - tag: component
              value: raw
