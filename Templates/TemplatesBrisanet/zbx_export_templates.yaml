            - uuid: 180c3bb05d4b4492a549d743060f6377
              name: 'Interface {#IFNAME}: Bits sent'
              type: DEPENDENT
              key: 'net.if.out[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''OutTraffic bps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
              tags:
