            - uuid: ba2ef493d0df4f58b2ba91a42973010a
              name: 'ICHASI - CCIP:{#CCIP} TPSIP:{#TPSIP} OCUPADO'
              type: DEPENDENT
              key: 'ocupado[{#CCIP}.{#TPSIP}]'
              delay: '0'
              history: 7d
              trends: 30d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.CCIP==''{#CCIP}'')].TPS[?(@.TPSIP==''{#TPSIP}'')].OCUPADO.first()'
              master_item:
                key: 'system.run[python3 /etc/zabbix/scripts/convertICHASI.py /etc/zabbix/scripts/ICHASI_{$VSS_IP}.RCC,]'
              tags:
                - tag: Application
                  value: ICHASI
          master_item:
            key: 'system.run[python3 /etc/zabbix/scripts/convertICHASI.py /etc/zabbix/scripts/ICHASI_{$VSS_IP}.RCC,]'
          lld_macro_paths:
            - lld_macro: '{#CCIP}'
              path: $..ccip.first()
            - lld_macro: '{#TPSIP}'
              path: $..tpsip.first()
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var discovery = [];
                  
                  data.forEach(function(ccipBlock) {
                      var ccip = ccipBlock.CCIP;
                  
                      ccipBlock.TPS.forEach(function(tpsItem) {
                          discovery.push({
                              "ccip": ccip,
                              "tpsip": tpsItem.TPSIP
                          });
                      });
                  });
                  
                  return JSON.stringify({ data: discovery });
