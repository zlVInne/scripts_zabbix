        - uuid: 0b01c40f6ea348c19e9ff0a357930ad3
          name: Status
          key: 'system.run[{$STATUS},]'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var text = value;
                  
                  // Função para converter uptime em segundos
                  function parseUptime(str) {
                      var total = 0;
                  
                      var patterns = [
                          { regex: /(\d+)\s+years?/, mult: 31536000 },
                          { regex: /(\d+)\s+days?/, mult: 86400 },
                          { regex: /(\d+)\s+hours?/, mult: 3600 },
                          { regex: /(\d+)\s+minutes?/, mult: 60 },
                          { regex: /(\d+)\s+seconds?/, mult: 1 }
                      ];
                  
                      patterns.forEach(function(p) {
                          var m = str.match(p.regex);
                          if (m) total += parseInt(m[1]) * p.mult;
                      });
                  
                      return total;
                  }
                  
                  // Extrair dados
                  var uptimeMatch = text.match(/^UP (.+)/m);
                  var versionMatch = text.match(/FreeSWITCH \(Version ([^)]+)\)/);
                  var sessionsTotalMatch = text.match(/(\d+)\s+session\(s\) since startup/);
                  var sessionsLineMatch = text.match(/(\d+)\s+session\(s\)\s+- peak (\d+), last 5min (\d+)/);
                  var spsMatch = text.match(/(\d+)\s+session\(s\) per Sec out of max (\d+), peak (\d+), last 5min (\d+)/);
                  var maxSessionsMatch = text.match(/(\d+)\s+session\(s\) max/);
                  var cpuMatch = text.match(/min idle cpu ([\d\.]+)\/([\d\.]+)/);
                  
                  // Valores base
                  var sessions_current = sessionsLineMatch ? parseInt(sessionsLineMatch[1]) : null;
                  var sessions_peak = sessionsLineMatch ? parseInt(sessionsLineMatch[2]) : null;
                  var sessions_last5min = sessionsLineMatch ? parseInt(sessionsLineMatch[3]) : null;
                  var sessions_max = maxSessionsMatch ? parseInt(maxSessionsMatch[1]) : null;
                  
                  var sps_current = spsMatch ? parseInt(spsMatch[1]) : null;
                  var sps_max = spsMatch ? parseInt(spsMatch[2]) : null;
                  var sps_peak = spsMatch ? parseInt(spsMatch[3]) : null;
                  var sps_last5min = spsMatch ? parseInt(spsMatch[4]) : null;
                  
                  // =====================
                  // CÁLCULOS INTELIGENTES
                  // =====================
                  
                  // % uso de sessões
                  var sessions_usage_pct = (sessions_current !== null && sessions_max) 
                      ? (sessions_current / sessions_max) * 100 
                      : null;
                  
                  // % uso de SPS (últimos 5 min é mais confiável)
                  var sps_usage_pct = (sps_last5min !== null && sps_max) 
                      ? (sps_last5min / sps_max) * 100 
                      : null;
                  
                  // headroom (folga)
                  var sessions_headroom = (sessions_max !== null && sessions_current !== null)
                      ? (sessions_max - sessions_current)
                      : null;
                  
                  var sps_headroom = (sps_max !== null && sps_last5min !== null)
                      ? (sps_max - sps_last5min)
                      : null;
                  
                  // flags de risco (booleans)
                  var sessions_warning = sessions_usage_pct !== null && sessions_usage_pct > 70 ? 1 : 0;
                  var sessions_critical = sessions_usage_pct !== null && sessions_usage_pct > 85 ? 1 : 0;
                  
                  var sps_warning = sps_usage_pct !== null && sps_usage_pct > 80 ? 1 : 0;
                  var sps_critical = sps_usage_pct !== null && sps_usage_pct > 100 ? 1 : 0;
                  
                  // gargalo principal (heurística simples)
                  var bottleneck = "none";
                  if (sps_critical) {
                      bottleneck = "sps";
                  } else if (sessions_critical) {
                      bottleneck = "sessions";
                  }
                  
                  // Montar JSON
                  var result = {
                      uptime_seconds: uptimeMatch ? parseUptime(uptimeMatch[1]) : null,
                      version: versionMatch ? versionMatch[1] : null,
                  
                      sessions_total: sessionsTotalMatch ? parseInt(sessionsTotalMatch[1]) : null,
                      sessions_current: sessions_current,
                      sessions_peak: sessions_peak,
                      sessions_last5min: sessions_last5min,
                      sessions_max: sessions_max,
                  
                      sps_current: sps_current,
                      sps_max: sps_max,
                      sps_peak: sps_peak,
                      sps_last5min: sps_last5min,
                  
                      cpu_idle_min: cpuMatch ? parseFloat(cpuMatch[1]) : null,
                      cpu_idle_max: cpuMatch ? parseFloat(cpuMatch[2]) : null,
                  
                      // =====================
                      // DERIVADOS
                      // =====================
                      sessions_usage_pct: sessions_usage_pct,
                      sessions_headroom: sessions_headroom,
                  
                      sps_usage_pct: sps_usage_pct,
                      sps_headroom: sps_headroom,
                  
                      sessions_warning: sessions_warning,
                      sessions_critical: sessions_critical,
                  
                      sps_warning: sps_warning,
                      sps_critical: sps_critical,
                  
                      bottleneck: bottleneck
                  };
                  
                  return JSON.stringify(result);
          tags:
            - tag: component
              value: VMS
        - uuid: 038f9157e5a849538faf30e22eebd733
          name: Uptime
