              value: system
          triggers:
            - uuid: bdedbadf58dc459f93d83364cd0f0049
              expression: 'last(/Template_Linux_TAS/system.name[node_exporter],#1)<>last(/Template_Linux_TAS/system.name[node_exporter],#2) and length(last(/Template_Linux_TAS/system.name[node_exporter]))>0'
              name: 'Linux: System name has changed'
              event_name: 'Linux: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'The name of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: notice
                - tag: scope
                  value: security
        - uuid: a7a1c7fbc8034aa9a55156c94e5341fb
          name: 'System Info'
          key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          delay: 3m
          history: 1h
          value_type: TEXT
          trends: '0'
          timeout: 3s
          tags:
            - tag: component
              value: raw
          triggers:
            - uuid: 87dfae8d401d42229537523e080c3c92
              expression: 'nodata(/Template_Linux_TAS/system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},],30m)=1'
              name: 'Linux: node_exporter is not available'
              event_name: 'node_exporter is not available (or no data for 30m)'
              priority: WARNING
              description: 'Failed to fetch system metrics from node_exporter in time.'
              manual_close: 'YES'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: availability
        - uuid: a2243e9658104315ba2f58950f97d16f
          name: 'Linux: Operating system'
          type: DEPENDENT
          key: 'system.sw.os[node_exporter]'
          delay: '0'
          history: 2w
          value_type: CHAR
          trends: '0'
          inventory_link: OS
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''System Info''][''System Description'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: os
          triggers:
            - uuid: 2751123364714766878eb58edfedcbc3
              expression: 'last(/Template_Linux_TAS/system.sw.os[node_exporter],#1)<>last(/Template_Linux_TAS/system.sw.os[node_exporter],#2) and length(last(/Template_Linux_TAS/system.sw.os[node_exporter]))>0'
              name: 'Linux: Operating system description has changed'
              priority: INFO
              description: 'The description of the operating system has changed. Possible reasons are that the system has been updated or replaced. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              dependencies:
                - name: 'Linux: System name has changed'
                  expression: 'last(/Template_Linux_TAS/system.name[node_exporter],#1)<>last(/Template_Linux_TAS/system.name[node_exporter],#2) and length(last(/Template_Linux_TAS/system.name[node_exporter]))>0'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: notice
        - uuid: e1dbf0db56ee493bb6486326ad39c6f0
          name: 'Linux: Free swap space'
          type: DEPENDENT
          key: 'system.swap.free[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: 'The free space of the swap volume/file expressed in bytes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Memory Metrics''][''Free Swap Space (Bytes)'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: memory
            - tag: component
              value: storage
        - uuid: 88be79b5ba8441ae8b7672dff6cc7c8c
          name: 'Linux: Free swap space in %'
          type: CALCULATED
          key: 'system.swap.pfree[node_exporter]'
          history: 7d
          value_type: FLOAT
          units: '%'
          params: 'last(//system.swap.free[node_exporter])/last(//system.swap.total[node_exporter])*100'
          description: 'The free space of the swap volume/file expressed in %.'
          tags:
            - tag: component
              value: memory
            - tag: component
              value: storage
        - uuid: dfe8680d2a8642d586568b7e2075a41d
          name: 'Linux: Total swap space'
          type: DEPENDENT
          key: 'system.swap.total[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: 'The total space of the swap volume/file expressed in bytes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Memory Metrics''][''Total Swap Space (Bytes)'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: memory
            - tag: component
              value: storage
        - uuid: 229d49cb07c14dfc81145e19d8114274
          name: 'Linux: System uptime'
          type: DEPENDENT
          key: 'system.uptime[node_exporter]'
          delay: '0'
          history: 2w
          trends: '0'
          units: s
          description: 'The system uptime expressed in the following format: "N days, hh:mm:ss".'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''System Info''][''System Uptime'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 5a42aa5bf5614de3bf5b4d74aa8e082b
              expression: 'last(/Template_Linux_TAS/system.uptime[node_exporter])<10m'
              name: 'Linux: {HOST.NAME} has been restarted'
              event_name: 'Linux: {HOST.NAME} has been restarted (uptime < 10m)'
              priority: WARNING
              description: 'The device uptime is less than 10 minutes.'
              manual_close: 'YES'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: notice
        - uuid: de54aad3e2454b1dbaf9a245e1574713
          name: 'Linux: Available memory'
          type: DEPENDENT
          key: 'vm.memory.available[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: |
            The available memory:
            - in Linux - available = free + buffers + cache;
            - on other platforms calculation may vary.
            
            See also Appendixes in Zabbix Documentation about parameters of the `vm.memory.size` item.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Memory Metrics''][''Available Memory (Bytes)'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: memory
        - uuid: 9361f4f61b184acf94b038c36bea32d0
          name: 'Linux: Total memory'
          type: DEPENDENT
          key: 'vm.memory.total[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: 'The total memory expressed in bytes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Memory Metrics''][''Total Memory (Bytes)'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
          tags:
            - tag: component
              value: memory
        - uuid: 502b2b55cf154dc99a97722c203f3c09
          name: 'Linux: Memory utilization'
          type: CALCULATED
          key: 'vm.memory.util[node_exporter]'
          history: 7d
          value_type: FLOAT
          units: '%'
          params: '(last(//vm.memory.total[node_exporter])-last(//vm.memory.available[node_exporter]))/last(//vm.memory.total[node_exporter])*100'
          description: 'Memory used percentage is calculated as (total-available)/total*100.'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: b5e951b4370a4af98d2c4311257070ee
              expression: 'min(/Template_Linux_TAS/vm.memory.util[node_exporter],5m)>{$MEMORY.UTIL.MAX}'
              name: 'Linux: High memory utilization'
              event_name: 'Linux: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
              priority: AVERAGE
              description: 'The system is running out of free memory.'
              dependencies:
                - name: 'Linux: Lack of available memory'
                  expression: 'max(/Template_Linux_TAS/vm.memory.available[node_exporter],5m)<{$MEMORY.AVAILABLE.MIN} and last(/Template_Linux_TAS/vm.memory.total[node_exporter])>0'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: capacity
                - tag: scope
                  value: performance
      discovery_rules:
        - uuid: f647a0345fc64b5e8e268ed17342b52e
          name: 'Network interface discovery'
          type: DEPENDENT
          key: 'net.if.discovery[node_exporter]'
          delay: '0'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery of network interfaces. Requires node_exporter v0.18 and up.'
          item_prototypes:
            - uuid: 685ea981760c4b91bc2dbac3da6407fc
              name: 'Interface {#IFNAME}: Erros'
              type: DEPENDENT
              key: 'net.errors[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''Errors/s''].first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: b06237fddf1f495fa5889fa826179b2f
              name: 'Interface {#IFNAME}: Inbound packets'
              type: DEPENDENT
              key: 'net.if.in.errors[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''InTraffic pkps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 286cd3bf56a64fd5bfa8d715685ce64b
              name: 'Interface {#IFNAME}: Bits received'
              type: DEPENDENT
              key: 'net.if.in[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''InTraffic bps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 88b7ec5167314c108e2106ce55653fbf
              name: 'Interface {#IFNAME}: Outbound packets'
              type: DEPENDENT
              key: 'net.if.out.errors[node_exporter"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@[''Interface''] == ''{#IFNAME}'')][''OutTraffic pkps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 3c19c1e68c9244afbbc1321ac2d328cd
              name: 'Interface {#IFNAME}: Bits sent'
              type: DEPENDENT
              key: 'net.if.out[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''OutTraffic bps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto.sh {$SERVER} {$PASSWORD},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
          trigger_prototypes:
            - uuid: 69b8903dc6a64e29ad3d410f6620ddcc
              expression: |
                min(/Template_Linux_TAS/net.if.in.errors[node_exporter,"{#IFNAME}"],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
                or min(/Template_Linux_TAS/net.if.out.errors[node_exporter"{#IFNAME}"],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                max(/Template_Linux_TAS/net.if.in.errors[node_exporter,"{#IFNAME}"],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
                and max(/Template_Linux_TAS/net.if.out.errors[node_exporter"{#IFNAME}"],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8
              name: 'Interface {#IFNAME}: High error rate'
