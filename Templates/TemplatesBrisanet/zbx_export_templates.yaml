                  expression: 'max(/Template_Linux_MAS_VSS/vm.memory.available[node_exporter],5m)<{$MEMORY.AVAILABLE.MIN} and last(/Template_Linux_MAS_VSS/vm.memory.total[node_exporter])>0'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: capacity
                - tag: scope
                  value: performance
      discovery_rules:
        - uuid: 202b0c47b4fb4ba5b617d420bd265895
          name: 'Network interface discovery'
          type: DEPENDENT
          key: 'net.if.discovery[node_exporter]'
          delay: '0'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovery of network interfaces. Requires node_exporter v0.18 and up.'
          item_prototypes:
            - uuid: cdee547b4b214588b2516b08569036c0
              name: 'Interface {#IFNAME}: Erros'
              type: DEPENDENT
              key: 'net.errors[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''Errors/s''].first()'
              master_item:
                key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 530f415b08e64d70a65d951d79e9b4fe
              name: 'Interface {#IFNAME}: Inbound packets'
              type: DEPENDENT
              key: 'net.if.in.errors[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''InTraffic pkps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 1e6b10993ea84a06b9ce0c3a0f3c30d4
              name: 'Interface {#IFNAME}: Bits received'
              type: DEPENDENT
              key: 'net.if.in[node_exporter,"{#IFNAME}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@.Interface=="{#IFNAME}")].[''InTraffic bps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: cf06bcb4b4994f75a93544ee57b61d64
              name: 'Interface {#IFNAME}: Outbound packets'
              type: DEPENDENT
              key: 'net.if.out.errors[node_exporter"{#IFNAME}"]'
              delay: '0'
              history: 7d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[''NetworkSensors''][?(@[''Interface''] == ''{#IFNAME}'')][''OutTraffic pkps''].first()'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
