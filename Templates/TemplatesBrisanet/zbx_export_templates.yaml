        - uuid: c041a1cbaa7e46889989d294864640cf
          name: 'Json - ILICCE'
          key: 'system.run[python3 /etc/zabbix/scripts/convertILICCE.py /etc/zabbix/scripts/ILICCE_{$VSI_IP}.RCC,]'
          delay: 5m
          history: 7d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  
                  // lista de LICENCA que devem ser mantidas (com os números)
                  var keep = [
                      "59   Qtd. Cadastros no Servico Translacao Numerica",
                      "83   Qtd. Cadastros na Lista de Translacao Numerica",
                      "88   Quantidade de Enlaces SCC #7",
                      "89   Qtd. de Numeros Telefonicos do Servico CASE",
                      "115  Qtd. Cadastros na Aplicacao Portabilidade Numerica",
                      "118  Processadores de Sinalizacao M2PA",
                      "124  Recursos SIP para Acesso a Servicos da Plataforma",
                      "149  Qtd. de CDR do Tipo Multifuncao X10**6",
                      "160  Qtd. Tabelas p/ Aplicacao Translacao de Categoria",
                      "163  Processadores de Sinalizacao Sigtran-M2UA",
                      "166  Qtd. de Enlaces M2PA na Plataforma",
                      "167  Qtd. de Enlaces M2UA na Plataforma",
                      "205  Qtd. de Manipulacoes Numericas",
                      "206  Numero Maximo de Processadores Virtuais",
                      "216  Capacidade Para Grupo de Sinalizacao SIP",
                      "217  Capacidade Para Grupo de Sinalizacao SIP-T",
                      "218  Capacidade Para Grupo de Sinalizacao SIP-I",
                      "219  Capacidade Para Grupo de Sinalizacao SIP-ISC",
                      "249  Qtd. Cadastros no Servico DSEL_A",
                      "280  Qtd. de IGR/PFG Criados na Plataforma",
                      "282  Qtd. de BI CICAT no equipamento",
                      "329  Qtd. de Dias de Permanencia de Arq Transferido",
                      "334  Qtd. Cadastro no Servico TRAD_NUM",
                      "335  Qtd. Numeros por Grupo de Traducao Numerica",
                      "346  Qtd. de PFE Criados na Plataforma"
                  ];
                  
                  // filtra somente os itens da lista
                  var filtered = data.filter(function(item) {
                      return keep.indexOf(item["LICENCA"].trim()) !== -1;
                  });
                  
                  // retorna apenas o JSON filtrado
                  return JSON.stringify(filtered);
          timeout: 3s
          tags:
            - tag: component
              value: raw
