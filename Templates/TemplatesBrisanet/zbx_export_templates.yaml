            - type: JAVASCRIPT
              parameters:
                - |
                  //Calculate utilization
                  return (100 - value)
          master_item:
            key: 'system.cpu.idle[node_exporter]'
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: cfbc09e2b5e34ff3a97d51a67ec1b496
              expression: 'min(/Template_Linux_TAS/system.cpu.util[node_exporter],5m)>{$CPU.UTIL.CRIT}'
              name: 'Linux: High CPU utilization'
              event_name: 'Linux: High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)'
              opdata: 'Current utilization: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'The CPU utilization is too high. The system might be slow to respond.'
              dependencies:
                - name: 'Linux: Load average is too high'
                  expression: |
                    min(/Template_Linux_TAS/system.cpu.load.avg1[node_exporter],5m)/last(/Template_Linux_TAS/system.cpu.num[node_exporter])>{$LOAD_AVG_PER_CPU.MAX.WARN}
                    and last(/Template_Linux_TAS/system.cpu.load.avg5[node_exporter])>0
                    and last(/Template_Linux_TAS/system.cpu.load.avg15[node_exporter])>0
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: performance
