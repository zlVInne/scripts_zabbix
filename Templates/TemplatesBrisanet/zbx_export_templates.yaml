          type: DEPENDENT
          key: licenca.sum.contratadas
          delay: '0'
          history: 7d
          value_type: FLOAT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // 'value' é a entrada do item mestre, que contém seu JSON
                  var data = JSON.parse(value);
                  
                  var total_contratada = 0;
                  
                  for (var i = 0; i < data.length; i++) {
                      var v = data[i]["QTDE_CONTRATADA"]; // pega o campo certo
                      if (typeof v === "undefined" || v === "-" || v === null || v.toString().trim() === "") {
                          v = 0;
                      } else {
                          v = parseInt(v.toString().replace(",", ""), 10);
                      }
                      total_contratada += v;
                  }
                  
                  return total_contratada;
