                  value: NMSIDADDS
            - uuid: bd4aa75098c94029a1caa9af4cebbcec
              name: 'NMSIDADDS - PRO:{#PRO} SERVICO:{#SERVICO} Periodo5'
              type: DEPENDENT
              key: 'periodo5[{#PRO}.{#SERVICO}]'
              delay: '0'
              history: 7d
              trends: 30d
