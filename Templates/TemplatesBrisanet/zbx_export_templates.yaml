      items:
        - uuid: 4e1d3bbe5f5c47fbb9183486b43c526b
          name: 'Balanceamento das Rotas'
          key: 'system.run[python3 /etc/zabbix/scripts/parser_balanceamento.py {$IP1} {$IP2}]'
          delay: 5m
          value_type: TEXT
          trends: '0'
        - uuid: eb92b1f107d94abda29050f12ba61919
          name: 'IP1 - Balanceamento'
          type: DEPENDENT
          key: vsi.balanceamento.ip1
          delay: '0'
          value_type: FLOAT
          preprocessing:
            - type: REGEX
              parameters:
                - 'IP1:\s([0-9.]+)%'
                - \1
          master_item:
            key: 'system.run[python3 /etc/zabbix/scripts/parser_balanceamento.py {$IP1} {$IP2}]'
          triggers:
            - uuid: d01e2ae6b31543a0a47175f97de9daa2
              expression: |
                last(/Balanceamento_Rotas_VSI/vsi.balanceamento.ip1) < 40 
                or 
                last(/Balanceamento_Rotas_VSI/vsi.balanceamento.ip1) > 60
              name: 'Rotas desbalanceadas: {$IP1} ({?last(//vsi.balanceamento.ip1)}%) | {$IP2} ({?last(//vsi.balanceamento.ip2)}%)'
              priority: WARNING
              manual_close: 'YES'
        - uuid: 67f164d74a5f44c6b4bc33cf973c946f
