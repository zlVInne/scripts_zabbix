              expression: 'last(/Template_Linux_MAS_VSI/system.sw.os[node_exporter],#1)<>last(/Template_Linux_MAS_VSI/system.sw.os[node_exporter],#2) and length(last(/Template_Linux_MAS_VSI/system.sw.os[node_exporter]))>0'
              name: 'Linux: Operating system description has changed'
              priority: INFO
              description: 'The description of the operating system has changed. Possible reasons are that the system has been updated or replaced. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              dependencies:
                - name: 'Linux: System name has changed'
                  expression: 'last(/Template_Linux_MAS_VSI/system.name[node_exporter],#1)<>last(/Template_Linux_MAS_VSI/system.name[node_exporter],#2) and length(last(/Template_Linux_MAS_VSI/system.name[node_exporter]))>0'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
