          master_item:
            key: prometheus.cpu.discovery
          lld_macro_paths:
            - lld_macro: '{#NAME}'
              path: $..name.first()
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var results = data.data.result;
                  
                  var discovery = results.map(function(item) {
                    return {
                      "name": item.metric.name
                    };
                  });
                  
                  return JSON.stringify({ data: discovery });
