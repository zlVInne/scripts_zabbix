          triggers:
            - uuid: 9aec9cd0007b4324abc1b751390fcc04
              expression: 'last(/Template_Linux_Tas_Mas/system.name[node_exporter],#1)<>last(/Template_Linux_Tas_Mas/system.name[node_exporter],#2) and length(last(/Template_Linux_Tas_Mas/system.name[node_exporter]))>0'
              name: 'Linux: System name has changed'
              event_name: 'Linux: System name has changed (new name: {ITEM.VALUE})'
              priority: INFO
              description: 'The name of the system has changed. Acknowledge to close the problem manually.'
              manual_close: 'YES'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: notice
                - tag: scope
                  value: security
        - uuid: 773a6bd0932d47cea089cc4e71cd3ec6
          name: 'Linux: Operating system'
          type: DEPENDENT
          key: 'system.sw.os[node_exporter]'
          delay: '0'
          history: 2w
          value_type: CHAR
          trends: '0'
          inventory_link: OS
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''System Info''][''System Description'']'
          master_item:
            key: system.info
          tags:
