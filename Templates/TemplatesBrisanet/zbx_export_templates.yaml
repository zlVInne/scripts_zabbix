        - uuid: 9c567dede9414bfea03056a6cf0091cf
          name: 'Prometheus - Network Container'
          type: DEPENDENT
          key: prometheus.network
          delay: '0'
          item_prototypes:
            - uuid: 4cba37b497e74e13bcf6bdac26caaf52
              name: 'Network Received - Interface:{#INTERFACE} Container:{#NAME}'
              type: DEPENDENT
              key: 'container.network.received[{#NAME}{#INTERFACE}]'
              delay: '0'
              history: 7d
              trends: 30d
              units: Bps
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var results = data.data.result;
                      
                      for (var i = 0; i < results.length; i++) {
                        if (
                          results[i].metric.name === '{#NAME}' &&
                          results[i].metric.interface === '{#INTERFACE}'
                        ) {
