                ((last(/Template_Linux_VPP/vfs.fs.total[node_exporter,"{#DISK}"])-last(/Template_Linux_VPP/vfs.fs.used[node_exporter,"{#DISK}"]))<{$VFS.FS.FREE.MIN.WARN:"{#FSNAME}"} or timeleft(/Template_Linux_VPP/vfs.fs.pused[node_exporter,"{#DISK}"],1h,100)<1d)
