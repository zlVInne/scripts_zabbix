              expression: 'last(/Template_Linux_VPP/system.sw.os[node_exporter],#1)<>last(/Template_Linux_VPP/system.sw.os[node_exporter],#2) and length(last(/Template_Linux_VPP/system.sw.os[node_exporter]))>0'
              name: 'Linux: Operating system description has changed'
