    - uuid: 235634bb592e43ed89fcfb235f38869b
      template: Template_Linux_MAS_VSI
      name: Template_Linux_MAS_VSI
      templates:
        - name: Template_Linux_Ping_MAS
      groups:
        - name: 'Templates/Operating systems'
        - name: VSI
      items:
        - uuid: 2e891e8ec341478bb746425b11a0d89e
          name: 'Linux: Number of open file descriptors'
          type: DEPENDENT
          key: 'fd.open[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Miscellaneous Sensors''][''Number of Open File Descriptors'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
          tags:
            - tag: component
              value: system
        - uuid: 95eb8628ec424cd5a36bbf0edddb4af0
          name: 'Linux: Maximum number of open file descriptors'
          type: DEPENDENT
          key: 'kernel.maxfiles[node_exporter]'
          delay: '0'
          history: 7d
          value_type: FLOAT
          description: 'It could be increased by using `sysctl` utility or modifying the file `/etc/sysctl.conf`.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.[''Miscellaneous Sensors''][''Maximum Number of Open File Descriptors'']'
          master_item:
            key: 'system.run[/tmp/cat_remoto_mas.sh {$SERVER} {$PASSWORD} {$FILE},]'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 0f36e5fb0b654e819375ebaea0373dc3
              expression: 'last(/Template_Linux_MAS_VSI/kernel.maxfiles[node_exporter])<{$KERNEL.MAXFILES.MIN}'
              name: 'Linux: Configured max number of open filedescriptors is too low'
              event_name: 'Linux: Configured max number of open filedescriptors is too low (< {$KERNEL.MAXFILES.MIN})'
              priority: INFO
              dependencies:
                - name: 'Linux: Running out of file descriptors'
                  expression: 'last(/Template_Linux_MAS_VSI/fd.open[node_exporter])/last(/Template_Linux_MAS_VSI/kernel.maxfiles[node_exporter])*100>80'
              tags:
                - tag: alerta
                  value: infra
                - tag: scope
                  value: performance
        - uuid: e209cc4830dc4f8a9f4ac60b8fe3ffc2
          name: 'Linux: System boot time'
